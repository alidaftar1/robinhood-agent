name: deploy-on-merge

# Auto-deploy to Vercel production when a PR is MERGED into main (2026-07-01).
# This makes the propose→approve loop seamless: the cloud autopilot opens a PR, the
# owner reviews + merges, and this ships it — no manual deploy step.
#
# SAFETY: fires ONLY on a merged PR from an `autopilot/…` branch (the cloud autopilot's own
# proposal branches) — completing its propose→approve→ship self-healing loop. It does
# NOT auto-deploy (a) direct pushes to main or (b) EXTERNAL/human PRs (Claude's in-session
# pushes, outside-contributor PRs like Hirad's) — those stay on the manual, review-gated
# `/code-review` + `REVIEWED=1 vercel deploy --prod` flow, so a human PR to a live-money
# app never ships without a review pass. A secret scan + build gate also run before deploy.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # Autopilot PRs only, by BRANCH PREFIX (autopilot/…) — token-agnostic, since the autopilot now
    # opens PRs with a PAT so the author is the PAT owner, not github-actions[bot]. Human/external
    # PRs (not on an autopilot/ branch — Hirad's fork PRs, direct pushes) fall through to the manual
    # review-gated deploy.
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'autopilot/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - name: Install deps (retry — bun install transiently flakes fetching @sentry/cli's binary in CI)
        run: |
          for i in 1 2 3; do
            if bun install; then exit 0; fi
            echo "bun install failed (attempt $i/3) — retrying in $((i*10))s"; sleep $((i*10))
          done
          echo "bun install failed after 3 attempts"; exit 1
      - name: Secret/PII scan (gate)
        run: bun run check:secrets
      - name: Typecheck + build (gate)
        run: bunx tsc --noEmit && bun run build
      - name: Install Vercel CLI
        run: npm i -g vercel
      - name: Deploy to production
        run: vercel deploy --prod --token="$VERCEL_TOKEN" --yes
