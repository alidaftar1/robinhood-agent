name: Eval health (LLM suite + registry replay)

# THE SLOW HALF OF THE SPLIT. scripts/test-fast.sh is the deterministic gate — ~950 tests in
# seconds, safe to block a deploy on. These two files are neither fast nor deterministic: they make
# live model calls and grade the output with an LLM judge, and three identical runs produced
# 3 / 3 / 1 failures. That 1-3 spread is the suite's NOISE FLOOR, not a signal.
#
# RUNTIME, measured rather than estimated: 641s on 2026-10-09 and 872s on 2026-10-13, i.e. 11-15
# minutes, not the ~55 this comment claimed until 2026-10-14. The 90-minute timeout below is now
# generous rather than tight; left as-is because an LLM suite's tail is long and a killed run tells
# you nothing.
#
# OBSERVED SCHEDULE DRIFT: the cron below asks for 11:00 UTC. The two runs to date actually started
# at 17:15 and 17:52 UTC — GitHub defers scheduled jobs on a quiet repo, here by about seven hours.
# So "well clear of the 07:30 trade cron" is NOT what happens; in practice this lands mid-session,
# after the trade run. That is harmless because nothing here touches the live account (see below),
# but do not rely on the stated hour for anything that would matter.
#
# So they run HERE, on a schedule, rather than in front of a deploy. A gate that flickers gets
# ignored, and then nothing gates. The trade-off is explicit: a real regression in model BEHAVIOUR
# is caught within a day instead of within a minute. Everything deterministic is still caught in
# seconds, and model behaviour is the slower-moving half.
#
# Nothing here touches the live account: these evals exercise prompts and judge their output. No
# order placement, no broker calls, no Upstash writes.

on:
  schedule:
    - cron: "0 11 * * 1-5"      # asks for 04:00 PT weekdays; actually fires ~7h late (see above)
  workflow_dispatch:
    inputs:
      max_calls:
        description: "LLM call budget ceiling (evals/llm-budget)"
        required: false
        default: "120"

concurrency:
  group: evals-llm
  cancel-in-progress: false

jobs:
  llm-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90          # measured 11-15 min; headroom without hanging a runner all day
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fail fast and LOUDLY rather than reporting a green run that made zero model calls — an eval
      # suite that silently no-ops is worse than one that is red.
      - name: Fail fast if the model key is absent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set — the LLM evals would pass vacuously."
            exit 1
          fi

      - name: Run the LLM evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_LLM: "1"
          EVAL_LLM_MAX_CALLS: ${{ github.event.inputs.max_calls || '120' }}
        run: |
          set -o pipefail
          bun test evals/eval.test.ts evals/reviewer-recall.test.ts --timeout 180000 2>&1 | tee /tmp/llm-evals.log

      # The summary is the point of running this unattended: the owner should be able to read the
      # outcome without opening the runner. Written even on failure.
      - name: Summarise
        if: always()
        run: |
          {
            echo "## LLM evals"
            echo ""
            echo "Commit \`${GITHUB_SHA:0:7}\` · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            grep -E "^\(fail\)|^ *[0-9]+ (pass|fail)|^Ran |^  [✓✗] [0-9]+ attempt|^sampled assertions" /tmp/llm-evals.log | tail -60 || echo "(no summary lines — see the log)"
            echo '```'
            echo ""
            echo "This suite is LLM-stochastic. Since 2026-10-21 each execution scenario is sampled"
            echo "PASS@3 with early exit, so a single unlucky draw no longer reddens the run and a"
            echo "healthy suite still costs one draw per scenario. A failure now means all THREE"
            echo "draws failed — treat it as real, not as the old 1-3 noise floor."
            echo ""
            echo "Read the ATTEMPT COUNTS above even when green: a scenario drifting from 1 attempt"
            echo "to 3 is degrading well before it goes red, which the old binary could not show."
          } >> "$GITHUB_STEP_SUMMARY"

  registry-replay:
    # Benchmarks the TEST SUITE against bugs we have already had: re-introduce each documented
    # incident, ask whether anything goes red, report caught/replayable. ~75 seconds, so it could
    # run per-push — it runs weekly instead because the number only moves when someone works on the
    # suite, and a score nobody reads is worse than one that arrives with a reason to look.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Replay the registry
        id: replay
        run: |
          set -o pipefail
          bun scripts/registry-replay.ts 2>&1 | tee /tmp/replay.log || true
      - name: Summarise
        if: always()
        run: |
          {
            echo "## Registry replay — can the suite catch bugs we have already had?"
            echo ""
            echo "Commit \`${GITHUB_SHA:0:7}\` · $(date -u '+%Y-%m-%d')"
            echo ""
            echo '```'
            grep -E "^  [✓✗⚠]|SCORE|did not run" /tmp/replay.log || cat /tmp/replay.log
            echo '```'
            echo ""
            echo "A ✗ is a LIVE control with no test behind it. A ⚠ is an anchor that drifted —"
            echo "fix the anchor, never drop the case: a case that stops replaying is how this"
            echo "number rots into something nobody questions."
          } >> "$GITHUB_STEP_SUMMARY"
