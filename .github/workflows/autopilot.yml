name: autopilot

# Cloud autopilot in PROPOSE MODE (2026-07-01): the owner's stand-in engineer.
# Reviews each morning's run like the owner would, and when it finds a real recurring
# issue it diagnoses the root cause and opens a PR proposing a guardrail — it does NOT
# deploy or push to main. No Vercel token/CLI here, so deploying is impossible by design;
# the owner reviews + merges. See .github/autopilot-prompt.md.
on:
  # Triggered by the Vercel 8am /api/autopilot cron (workflow_dispatch via the GitHub
  # API) right after the morning report — so the code-fixer runs ~8:05am PT with no
  # GitHub scheduler lag. The old `schedule:` cron was removed 2026-06-30: it fired a
  # redundant 2nd run ~10:30am PT (GitHub delays scheduled jobs ~1.5h). If a dispatch
  # ever fails, the morning report email still goes out (separate path); worst case is
  # one missed code-fix pass. Re-add a `schedule:` block here to restore a fallback.
  workflow_dispatch: {}

permissions:
  contents: write        # push the proposal branch
  pull-requests: write   # open the proposal PR
  issues: write          # maintain the "Autopilot Journal" issue (persistent memory)

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    # 45 (was 25): the 07-27 and 07-28 runs were both killed mid-diagnosis at the 25-min cap
    # (started ~15:01 UTC, cancelled ~15:26) before the email/journal steps — so no report went
    # out those days. Diagnose + build-a-proposal (evals, tsc, build, dry-run, push, PR) needs
    # more runway. --max-turns 50 still bounds a runaway. (The bot token can't push workflow
    # changes — no `workflows` scope — so this had to be edited + pushed locally.)
    timeout-minutes: 45
    env:
      APP_URL: https://robinhood-agent.vercel.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      # PAT (not GITHUB_TOKEN) for `gh pr create` + branch push, so the resulting pull_request
      # events actually TRIGGER autopilot-automerge + deploy-on-merge. GitHub deliberately suppresses
      # workflow runs triggered by GITHUB_TOKEN-created events (recursion guard) — which is why
      # auto-safe PRs silently sat at `action_required` and never merged. Falls back to github.token
      # when AUTOPILOT_PAT is unset, so this stays non-breaking until the secret is added (the loop
      # just stays manual-merge until then). PAT needs contents:write + pull-requests:write.
      GH_TOKEN: ${{ secrets.AUTOPILOT_PAT || github.token }}
      # No VERCEL_* here on purpose — propose mode cannot deploy.
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTOPILOT_PAT || github.token }}   # push the proposal branch as the PAT too
      - uses: oven-sh/setup-bun@v2
      - name: Install deps (retry — bun install transiently flakes fetching @sentry/cli's binary in CI)
        run: |
          for i in 1 2 3; do
            if bun install; then exit 0; fi
            echo "bun install failed (attempt $i/3) — retrying in $((i*10))s"; sleep $((i*10))
          done
          echo "bun install failed after 3 attempts"; exit 1
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code
      - name: Configure git for autonomous commits
        run: |
          git config user.name "robinhood-autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
      - name: Run autopilot agent
        # --model sonnet: the protocol (fetch/verify/patch/check numbers, small fixes) does not
        #   need Opus — Sonnet is ~5x cheaper on the API bill and plenty for this work.
        # --max-turns 90: bound a runaway session (cost + safety guard). Raised 50→90 on 2026-08-10:
        #   since the concern-handoff change (a9967cf) the fixer now WORKS a reviewConcerns list per run
        #   (diagnose + replay + evals/tsc/build + open a PR + journal), which is far heavier than the old
        #   "review → CLEAN → stop" run. The 08-10 run did all of that, opened PR #10, then exited 1 on the
        #   50-turn cap right after journaling — a successful run showing red. The dispatch is also gated to
        #   anomaly-days only (see /api/autopilot).
        run: claude -p "$(cat .github/autopilot-prompt.md)" --model sonnet --max-turns 90 --dangerously-skip-permissions --output-format text
